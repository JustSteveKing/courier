ws.project_has_collection:
  en: "%{path} already has a Courier collection. Open it, then use “Import Postman collection here…”."
  es: "%{path} ya tiene una colección de Courier. Ábrela y usa «Importar colección de Postman aquí…»."
  de: "%{path} hat bereits eine Courier-Sammlung. Öffne sie und nutze „Postman-Sammlung hierher importieren…“."
  fr: "%{path} a déjà une collection Courier. Ouvrez-la, puis utilisez « Importer une collection Postman ici… »."
ws.empty_title:
  en: Open a project to get started
  es: Abre un proyecto para empezar
  de: Öffne ein Projekt, um loszulegen
  fr: Ouvrez un projet pour commencer
ws.empty_hint:
  en: "Courier keeps a project's requests and environments in a %{dir} folder inside it, so they live in git with the code. Secret values stay in your keyring."
  es: "Courier guarda las solicitudes y entornos de un proyecto en una carpeta %{dir} dentro de él, para que vivan en git junto al código. Los valores secretos se quedan en tu llavero."
  de: "Courier speichert Anfragen und Umgebungen eines Projekts in einem Ordner %{dir} darin, sodass sie mit dem Code in git liegen. Secret-Werte bleiben in deinem Schlüsselbund."
  fr: "Courier range les requêtes et environnements d'un projet dans un dossier %{dir} à l'intérieur, pour qu'ils vivent dans git avec le code. Les valeurs secrètes restent dans votre trousseau."
