  es: ¿Crear una colección de Courier?
  de: Courier-Sammlung anlegen?
  fr: Créer une collection Courier ?
ws.init_project_message:
  en: "%{path} has no %{dir} folder yet. Create one, named “%{name}”? Its requests and environments are plain files you can commit with the project."
  es: "%{path} todavía no tiene una carpeta %{dir}. ¿Crear una llamada «%{name}»? Sus solicitudes y entornos son archivos normales que puedes versionar con el proyecto."
  de: "%{path} hat noch keinen Ordner %{dir}. Einen mit dem Namen „%{name}“ anlegen? Anfragen und Umgebungen sind normale Dateien, die mit dem Projekt eingecheckt werden können."
  fr: "%{path} n'a pas encore de dossier %{dir}. En créer un, nommé « %{name} » ? Ses requêtes et environnements sont de simples fichiers à versionner avec le projet."
