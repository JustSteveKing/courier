  es: Esto elimina %{path}.
  de: Dadurch wird %{path} gelöscht.
  fr: Cela supprime %{path}.
env.delete_message_with_secrets:
  en: This deletes %{path} and its %{count} stored secret(s).
  es: Esto elimina %{path} y sus %{count} secreto(s) guardado(s).
  de: Dadurch werden %{path} und %{count} gespeicherte(s) Secret(s) gelöscht.
  fr: Cela supprime %{path} et ses %{count} secret(s) enregistré(s).

