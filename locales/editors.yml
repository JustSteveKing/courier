  fr: Afficher ou masquer
secrets.remove:
  en: Remove secret
  es: Quitar secreto
  de: Secret entfernen
  fr: Supprimer le secret
secrets.add:
  en: Add secret
  es: Añadir secreto
  de: Secret hinzufügen
  fr: Ajouter un secret
