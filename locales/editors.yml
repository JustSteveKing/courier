  en: "These variables look like credentials and are saved in plain text:"
  es: "Estas variables parecen credenciales y se guardan en texto plano:"
  de: "Diese Variablen sehen nach Zugangsdaten aus und werden im Klartext gespeichert:"
  fr: "Ces variables ressemblent à des identifiants et sont enregistrées en clair :"
secrets.move_variable:
  en: Move %{name} to secrets
  es: Mover %{name} a secretos
  de: "%{name} zu Secrets verschieben"
  fr: Déplacer %{name} vers les secrets
secrets.could_not_store:
  en: "Could not store secrets: %{error}"
  es: "No se pudieron guardar los secretos: %{error}"
  de: "Secrets konnten nicht gespeichert werden: %{error}"
  fr: "Impossible de stocker les secrets : %{error}"
secrets.could_not_copy:
  en: "Could not copy secrets: %{error}"
  es: "No se pudieron copiar los secretos: %{error}"
  de: "Secrets konnten nicht kopiert werden: %{error}"
  fr: "Impossible de copier les secrets : %{error}"
secrets.could_not_read:
