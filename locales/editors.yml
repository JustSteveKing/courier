# MARK: Secret store
secrets.store_unavailable:
  en: The secret store isn't available yet
  es: El almacén de secretos aún no está disponible
  de: Der Secret-Speicher ist noch nicht verfügbar
  fr: Le coffre de secrets n'est pas encore disponible
secrets.store_unavailable_retry:
  en: The secret store isn't available yet; try again in a moment
  es: El almacén de secretos aún no está disponible; inténtalo de nuevo en un momento
  de: Der Secret-Speicher ist noch nicht verfügbar; versuche es gleich noch einmal
  fr: Le coffre de secrets n'est pas encore disponible ; réessayez dans un instant
secrets.backend_keyring:
  en: Values are stored in your desktop keyring, never in the collection files.
  es: Los valores se guardan en el llavero del escritorio, nunca en los archivos de la colección.
  de: Werte werden im Schlüsselbund des Desktops gespeichert, nie in den Sammlungsdateien.
  fr: Les valeurs sont stockées dans le trousseau de clés du bureau, jamais dans les fichiers de la collection.
secrets.backend_file:
  en: No desktop keyring found. Values are stored in an encrypted file whose key is kept separately on this machine.
  es: No se encontró un llavero del escritorio. Los valores se guardan en un archivo cifrado cuya clave se conserva por separado en este equipo.
  de: Kein Schlüsselbund gefunden. Werte werden in einer verschlüsselten Datei gespeichert, deren Schlüssel getrennt auf diesem Rechner liegt.
  fr: Aucun trousseau de clés trouvé. Les valeurs sont stockées dans un fichier chiffré dont la clé est conservée séparément sur cette machine.
