  es: "No se pudo leer el secreto: %{error}"
  de: "Secret konnte nicht gelesen werden: %{error}"
  fr: "Impossible de lire le secret : %{error}"
secrets.name_empty:
  en: Secret name can't be empty
  es: El nombre del secreto no puede estar vacío
  de: Der Name des Secrets darf nicht leer sein
  fr: Le nom du secret ne peut pas être vide
secrets.name_invalid:
  en: "`%{name}` can't contain spaces, colons or braces"
  es: "`%{name}` no puede contener espacios, dos puntos ni llaves"
  de: "`%{name}` darf keine Leerzeichen, Doppelpunkte oder geschweiften Klammern enthalten"
  fr: "`%{name}` ne peut pas contenir d'espaces, de deux-points ni d'accolades"
secrets.name_taken_secret:
  en: "`%{name}` is already a secret"
  es: "`%{name}` ya es un secreto"
  de: "`%{name}` ist bereits ein Secret"
  fr: "`%{name}` est déjà un secret"
secrets.name_taken_variable:
  en: "`%{name}` is already a variable; use “Move to secrets” instead"
  es: "`%{name}` ya es una variable; usa «Mover a secretos»"
  de: "`%{name}` ist bereits eine Variable; nutze stattdessen „Zu Secrets verschieben“"
  fr: "`%{name}` est déjà une variable ; utilisez plutôt « Déplacer vers les secrets »"
secrets.both_variable_and_secret:
  en: "`%{name}` is both a variable and a secret"
  es: "`%{name}` es a la vez variable y secreto"
  de: "`%{name}` ist gleichzeitig Variable und Secret"
  fr: "`%{name}` est à la fois une variable et un secret"

