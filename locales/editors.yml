  de: Courier lässt die API sich selbst beschreiben (Introspection) – mit URL, Headern und Secrets dieser Anfrage. Das Schema liefert diese Dokumentation und die Autovervollständigung im Abfrage-Editor.
  fr: Courier demande à l’API de se décrire (introspection) avec l’URL, les en-têtes et les secrets de cette requête. Le schéma alimente cette documentation et l’autocomplétion de l’éditeur de requête.
