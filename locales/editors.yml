env.hint_defaults:
  en: Defaults apply to every environment. Environments override them by name.
  es: Los valores por defecto se aplican a todos los entornos. Cada entorno los sobrescribe por nombre.
  de: Standardwerte gelten für jede Umgebung. Umgebungen überschreiben sie anhand des Namens.
  fr: Les valeurs par défaut s'appliquent à chaque environnement. Les environnements les remplacent par nom.
env.hint_overrides:
  en: Overrides the collection defaults by name.
  es: Sobrescribe por nombre los valores por defecto de la colección.
  de: Überschreibt die Standardwerte der Sammlung anhand des Namens.
  fr: Remplace par nom les valeurs par défaut de la collection.
env.hint_inherited:
