[package]
name = "courier"
version = "0.1.0"
edition = "2024"
description = "A fast, native API client for Linux"
license = "MIT"
readme = "README.md"

[workspace]
members = ["crates/courier-core", "crates/courier-cli"]

[dependencies]
courier-core = { path = "crates/courier-core" }
courier-cli = { path = "crates/courier-cli" }
anyhow = "1.0.104"
async-channel = "2.5.0"
gpui-kit = { version = "0.6.1", features = ["tree-sitter", "tree-sitter-graphql"] }
indexmap = { version = "2.14.2", features = ["serde"] }
notify = "8.2.0"
reqwest = { version = "0.13", features = ["stream", "gzip", "brotli", "deflate", "cookies"] }
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps JSON keys in the order the API sent them, in bodies and
# in JSONPath suggestions.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "0.9.42"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
lsp-types = { version = "0.97", features = ["proposed"] }
serde_json_path = "0.7"
toml = "1.1.6"

[dev-dependencies]
courier-core = { path = "crates/courier-core", features = ["test-support"] }
futures-lite = "2.6.1"
gpui-kit = { version = "0.6.1", features = ["test-support", "tree-sitter", "tree-sitter-graphql"] }
tempfile = "3.27.0"

# A release build is what people install: worth the longer compile.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
