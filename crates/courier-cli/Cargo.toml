[package]
name = "courier-cli"
version = "0.1.0"
edition = "2024"
description = "Run Courier collections from the command line: send requests, run folders with checks, report to CI"
license = "MIT"

[lib]
name = "courier_cli"
path = "src/lib.rs"

[[bin]]
name = "courier-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
courier-core = { path = "../courier-core" }
futures-lite = "2.6.1"
# preserve_order keeps JSON keys in the order the API sent them, in bodies and
# in JSONPath suggestions.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
courier-core = { path = "../courier-core", features = ["test-support"] }
tempfile = "3.27.0"
